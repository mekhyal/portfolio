# Build CRA → upload `build/` → deploy to GitHub Pages.
# Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci fails fast if package-lock.json is missing or out of sync with package.json.
      # npm install still builds a working tree so the site can deploy.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            echo "::warning::package-lock.json missing — using npm install. Commit the lockfile from your laptop for reproducible builds."
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
          DISABLE_ESLINT_PLUGIN: true

      - name: Disable Jekyll
        run: touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
